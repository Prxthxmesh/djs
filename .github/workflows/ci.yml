name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      control-db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsched
          POSTGRES_PASSWORD: jobsched
          POSTGRES_DB: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobsched -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      shard-a:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsched
          POSTGRES_PASSWORD: jobsched
          POSTGRES_DB: postgres
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U jobsched -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      shard-b:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobsched
          POSTGRES_PASSWORD: jobsched
          POSTGRES_DB: postgres
        ports: ["55434:5432"]
        options: >-
          --health-cmd "pg_isready -U jobsched -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      TEST_CONTROL_URL: postgres://jobsched:jobsched@localhost:55432/jobsched_control_test
      TEST_SHARD_A_URL: postgres://jobsched:jobsched@localhost:55433/jobsched_shard_test
      TEST_SHARD_B_URL: postgres://jobsched:jobsched@localhost:55434/jobsched_shard_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:server
      - run: npm --prefix web run build

  chaos-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Build application image
        run: docker build -t jobsched-app:local .
      - name: Start stack
        run: docker compose up -d --no-build
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose ps
          docker compose logs --tail=200 api scheduler-1 worker-1
          exit 1
      - name: Run worker-crash chaos smoke test
        run: npm run chaos:smoke
      - name: Upload chaos artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-smoke
          path: benchmarks/chaos-*.json
      - name: Stop stack
        if: always()
        run: docker compose down -v
